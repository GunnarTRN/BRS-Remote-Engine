name: Publish BRS Remote Engine validated artifact

on:
  workflow_dispatch:
  push:
    branches: [brs-branding-1.4.9]
    paths:
      - '.github/workflows/brs-promote-artifact.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download validated artifact from successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p brs-release
          gh run download 35469234974 \
            --repo "${{ github.repository }}" \
            --name BRS-Remote-Engine-Windows-x64 \
            --dir brs-release
          test -f brs-release/BRS-Remote-Engine-x64.exe
          test -f brs-release/BRS-Remote-Engine-x64.exe.sha256
          cd brs-release
          sha256sum -c BRS-Remote-Engine-x64.exe.sha256
          test "$(sha256sum BRS-Remote-Engine-x64.exe | awk '{print $1}')" = "d8ff8eb0eba5ecac20e7c4313e6b8e7513a45b3c5d185ebde3c3e10cb385dfa1"

      - name: Publish immutable CI prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="brs-engine-1.4.9-ci4"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG" brs-release/* \
            --repo "${{ github.repository }}" \
            --target 1c0223fe9c8d33afee3ec6ac88ad6d4304fbb8f6 \
            --title "BRS Remote Engine 1.4.9 CI4" \
            --notes "Validated Windows x64 CI artifact from successful workflow run 35469234974. Derivative of RustDesk OSS 1.4.9; GNU AGPL v3.0 notices included." \
            --prerelease
